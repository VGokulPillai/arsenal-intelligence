resources:
  apps:
    arsenal_app:
      name: arsenal-intelligence
      description: "Arsenal FC Football Intelligence Platform — AI-powered control center with Lakebase fan operations, live football data, and commercial analytics"
      source_code_path: ..

      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_branches.production.name}
            database: ${resources.postgres_databases.arsenal_fan_ops_db.name}
            permission: CAN_CONNECT_AND_CREATE

        - name: serving-endpoint
          serving_endpoint:
            name: "databricks-claude-sonnet-4-5"
            permission: CAN_QUERY
