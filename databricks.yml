bundle:
  name: arsenal-intelligence

include:
  - resources/arsenal.app.yml
  - resources/arsenal.lakebase.yml

sync:
  exclude:
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/.git/**"
    - "data/sample_videos/**"
    - "frontend/src/**"
    - "frontend/public/**"
    - "frontend/index.html"
    - "frontend/package.json"
    - "frontend/vite.config.ts"
    - "frontend/tsconfig.json"
    - "frontend/tsconfig.tsbuildinfo"
    - "frontend/tailwind.config.js"
    - "frontend/postcss.config.js"

variables:
  workspace_host:
    default: "https://fevm-serverless-stable-1acr1x.cloud.databricks.com"
    description: "Databricks workspace URL"

  warehouse_id:
    default: ""
    description: "SQL warehouse ID (optional)"

  catalog:
    default: "main"
    description: "Unity Catalog catalog"

  schema:
    default: "arsenal"
    description: "Unity Catalog schema"

  lakebase_project_id:
    default: "arsenal-lakebase"
    description: "Lakebase project ID for DABs resource definition"

  app_sp_client_id:
    default: "293f5e9b-94aa-4396-9739-4239164ecf12"
    description: "App service principal client ID"

  dev_group_name:
    default: "arsenal-dev"
    description: "Development group name for permissions"

  uat_group_name:
    default: "arsenal-uat"
    description: "UAT group name for permissions"

  prod_min_cu:
    default: 4
    description: "Production endpoint minimum compute units"

  prod_max_cu:
    default: 8
    description: "Production endpoint maximum compute units"

  dev_min_cu:
    default: 0.5
    description: "Dev/UAT endpoint minimum compute units"

  dev_max_cu:
    default: 2
    description: "Dev/UAT endpoint maximum compute units"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-serverless-stable-1acr1x.cloud.databricks.com
      profile: fe-vm-1acr1x
    variables:
      catalog: "main"
      schema: "arsenal_dev"
    resources:
      apps:
        arsenal_app:
          resources:
            - name: postgres
              postgres:
                branch: ${resources.postgres_branches.development.name}
                database: ${resources.postgres_branches.development.name}/databases/db-k5rv-e6gmeiiqbn
                permission: CAN_CONNECT_AND_CREATE
            - name: serving-endpoint
              serving_endpoint:
                name: "databricks-claude-sonnet-4-5"
                permission: CAN_QUERY

  uat:
    workspace:
      host: https://fevm-serverless-stable-1acr1x.cloud.databricks.com
      profile: fe-vm-1acr1x
    variables:
      catalog: "main"
      schema: "arsenal_uat"
    resources:
      apps:
        arsenal_app:
          name: arsenal-intelligence-uat
          resources:
            - name: postgres
              postgres:
                branch: ${resources.postgres_branches.uat.name}
                database: ${resources.postgres_branches.uat.name}/databases/db-k5rv-e6gmeiiqbn
                permission: CAN_CONNECT_AND_CREATE
            - name: serving-endpoint
              serving_endpoint:
                name: "databricks-claude-sonnet-4-5"
                permission: CAN_QUERY

  prod:
    mode: production
    workspace:
      host: https://fevm-serverless-stable-1acr1x.cloud.databricks.com
      profile: fe-vm-1acr1x
    variables:
      catalog: "main"
      schema: "arsenal"
    resources:
      apps:
        arsenal_app:
          resources:
            - name: postgres
              postgres:
                branch: ${resources.postgres_branches.production.name}
                database: ${resources.postgres_databases.arsenal_fan_ops_db.name}
                permission: CAN_CONNECT_AND_CREATE
            - name: serving-endpoint
              serving_endpoint:
                name: "databricks-claude-sonnet-4-5"
                permission: CAN_QUERY
